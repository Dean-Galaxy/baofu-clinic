services:
  baofu-clinic:
    build:
      context: .
      dockerfile: Dockerfile.tencent
    image: baofu-clinic:latest
    container_name: baofu-clinic
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3002
    ports:
      - "127.0.0.1:3002:3002"
